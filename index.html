// Payroll-correct lookup: highest bracket ≤ gross
function taxFromTabell30(gross) {
  const row = tabell30_col1.find(
    r => gross >= r.min && gross <= r.max
  );

  if (!row) return 0;

  if (row.type === "fixed") {
    return row.value;
  }

  if (row.type === "percent") {
    return gross * (row.value / 100);
  }

  return 0;
}
