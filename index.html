<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>Swedish Payslip Generator – Tabell 30</title>

<style>
body { font-family: Arial, sans-serif; background:#f4f4f4; padding:20px; }
.container { max-width:900px; margin:auto; }

.form, .payslip {
  background:#fff;
  padding:20px;
  border:1px solid #000;
  margin-bottom:20px;
}

label { font-weight:bold; display:block; margin-top:10px; }
input, select { width:100%; padding:6px; margin-top:4px; }
button { margin-top:15px; padding:8px 14px; cursor:pointer; }

.header {
  display:flex;
  justify-content:space-between;
  margin-bottom:15px;
}

table { width:100%; border-collapse:collapse; margin-top:15px; }
table, th, td { border:1px solid #000; }
th, td { padding:6px; }
.total { font-weight:bold; }

.footer {
  margin-top:20px;
  font-size:12px;
  border-top:1px solid #000;
  padding-top:10px;
}
</style>
</head>

<body>

<div class="container">

<div class="form">
<h3>Salary Slip Input (Skattetabell 30 – Column 1)</h3>

<label>Business Name</label>
<input id="company" value="Ittefaq Transport AB">

<label>Org.nr</label>
<input id="orgnr" value="559138-6643">

<label>Address</label>
<input id="address" value="Karpgatan 15, 13341 Saltsjöbaden">

<label>Phone</label>
<input id="phone" value="0739556767">

<label>Email</label>
<input id="email" value="ittefaq.transport08@gmail.com">

<label>Employee Name</label>
<input id="employee" value="Junaid Anwar">

<label>Employee ID</label>
<input id="empId" value="005">

<label>Church Member?</label>
<select id="church">
  <option value="0">No</option>
  <option value="0.01">Yes (1%)</option>
</select>

<label>Pay Period Start</label>
<input type="date" id="periodStart">

<label>Pay Period End</label>
<input type="date" id="periodEnd">

<label>Pay Date</label>
<input type="date" id="payDate">

<label>Monthly Salary (SEK)</label>
<input id="salary" type="number" value="32500">

<label>Allowances (SEK)</label>
<input id="allowance" type="number" value="3200">

<button onclick="generatePayslip()">Generate Payslip</button>
<button id="pdfBtn" onclick="downloadPDF()" disabled>Download PDF</button>
</div>

<div class="payslip" id="payslip" style="display:none;"></div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.3/html2pdf.bundle.min.js"></script>

<script>
// ---------------- TABELL 30 – COLUMN 1 (PARTIAL, EXTENDABLE) ----------------
const tabell30_col1 = [
  { max: 2000, tax: 0 },
  { max: 2100, tax: 150 },
  { max: 2200, tax: 152 },
  { max: 2300, tax: 154 },
  { max: 2400, tax: 156 },
  { max: 2500, tax: 158 },
  { max: 30000, tax: 6264 },
  { max: 31000, tax: 6516 },
  { max: 32000, tax: 6768 },
  { max: 33000, tax: 7020 },
  { max: 34000, tax: 7272 },
  { max: 35000, tax: 7524 },
  { max: 36000, tax: 7776 },
  { max: 37000, tax: 8028 }
];

// Payroll-correct lookup: highest bracket ≤ gross
function taxFromTabell30(gross) {
  let tax = 0;
  for (let row of tabell30_col1) {
    if (gross <= row.max) {
      tax = row.tax;
      break;
    }
    tax = row.tax;
  }
  return tax;
}

function generatePayslip() {

  const company = document.getElementById("company").value;
  const orgnr = document.getElementById("orgnr").value;
  const address = document.getElementById("address").value;
  const phone = document.getElementById("phone").value;
  const email = document.getElementById("email").value;

  const employee = document.getElementById("employee").value;
  const empId = document.getElementById("empId").value;

  const periodStart = document.getElementById("periodStart").value;
  const periodEnd = document.getElementById("periodEnd").value;
  const payDate = document.getElementById("payDate").value;

  const salary = Number(document.getElementById("salary").value);
  const allowance = Number(document.getElementById("allowance").value);
  const churchRate = Number(document.getElementById("church").value);

  const gross = salary + allowance;
  const baseTax = taxFromTabell30(gross);
  const churchTax = gross * churchRate;
  const totalTax = baseTax + churchTax;

  const net = gross - totalTax;
  const employerFee = gross * 0.3142;
  const holidayPay = gross * 0.12;

  const p = document.getElementById("payslip");
  p.style.display = "block";

  p.innerHTML = `
    <div class="header">
      <div>
        <strong>${company}</strong><br>
        ${employee} (${empId})
      </div>
      <div>
        Period: ${periodStart} – ${periodEnd}<br>
        Pay date: ${payDate}
      </div>
    </div>

    <table>
      <tr><th>Description</th><th>SEK</th></tr>
      <tr><td>Monthly Salary</td><td>${salary.toFixed(2)}</td></tr>
      <tr><td>Allowances</td><td>${allowance.toFixed(2)}</td></tr>
      <tr class="total"><td>Gross Salary</td><td>${gross.toFixed(2)}</td></tr>
      <tr><td>Income Tax (Tabell 30)</td><td>${baseTax.toFixed(2)}</td></tr>
      <tr><td>Church Fee</td><td>${churchTax.toFixed(2)}</td></tr>
      <tr class="total"><td>Net Pay</td><td>${net.toFixed(2)}</td></tr>
      <tr><td>Employer Contribution</td><td>${employerFee.toFixed(2)}</td></tr>
      <tr><td>Holiday Pay Accrued</td><td>${holidayPay.toFixed(2)}</td></tr>
    </table>

    <div class="footer">
      ${company} | Org.nr ${orgnr}<br>
      ${address} | ${phone} | ${email}
    </div>
  `;

  document.getElementById("pdfBtn").disabled = false;
}

function downloadPDF() {
  html2pdf().from(document.getElementById("payslip")).save("salary-slip.pdf");
}
</script>

</body>
</html>
