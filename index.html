<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Payslip Test</title>

<style>
body { font-family: Arial; background:#f4f4f4; padding:20px; }
.box { background:#fff; padding:20px; max-width:700px; margin:auto; border:1px solid #000; }
label { display:block; margin-top:10px; font-weight:bold; }
input { width:100%; padding:6px; }
button { margin-top:15px; padding:8px 14px; }
table { width:100%; border-collapse:collapse; margin-top:15px; }
table, th, td { border:1px solid #000; }
th, td { padding:6px; }
.total { font-weight:bold; }
</style>
</head>

<body>

<div class="box">
<h3>Payslip Input</h3>

<label>Business Name</label>
<input id="company" value="Ittefaq Transport AB">

<label>Employee Name</label>
<input id="employee" value="Junaid Anwar">

<label>Monthly Salary</label>
<input id="salary" type="number" value="32500">

<label>Tax</label>
<input id="tax" type="number" value="6885">

<button onclick="generate()">Generate Payslip</button>
<button id="pdfBtn" onclick="downloadPDF()" disabled>Download PDF</button>
</div>

<div class="box" id="payslip" style="display:none;"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.3/html2pdf.bundle.min.js"></script>

<script>
function generate() {
    const company = document.getElementById("company").value;
    const employee = document.getElementById("employee").value;
    const salary = Number(document.getElementById("salary").value);
    const tax = Number(document.getElementById("tax").value);
    const net = salary - tax;

    document.getElementById("payslip").style.display = "block";
    document.getElementById("payslip").innerHTML = `
        <strong>${company}</strong><br>
        Employee: ${employee}

        <table>
            <tr><th>Description</th><th>SEK</th></tr>
            <tr><td>Gross Salary</td><td>${salary.toFixed(2)}</td></tr>
            <tr><td>Tax</td><td>${tax.toFixed(2)}</td></tr>
            <tr class="total"><td>Net Pay</td><td>${net.toFixed(2)}</td></tr>
        </table>
    `;

    document.getElementById("pdfBtn").disabled = false;
}

function downloadPDF() {
    html2pdf().from(document.getElementById("payslip")).save("payslip.pdf");
}
</script>

</body>
</html>
